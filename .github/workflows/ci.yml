name: Validate Dockge fork

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run lint
      - run: npm run check-ts
      - run: npm run test:socket
      - run: npm run build:frontend
      - name: Build the actual release image
        run: docker build --target release -f docker/Dockerfile -t dockge-check:local .
      - name: Start isolated image
        run: |
          docker run -d --name dockge-check -p 127.0.0.1:5001:5001 --tmpfs /app/data --tmpfs /opt/stacks -e DOCKGE_STACKS_DIR=/opt/stacks dockge-check:local
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 --output /dev/null http://127.0.0.1:5001/
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test rendered frontend and connection stability
        run: npm run test:browser
      - name: Verify container health
        run: |
          docker exec dockge-check extra/healthcheck
          test "$(docker inspect --format '{{.RestartCount}}' dockge-check)" = 0
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockge-browser-validation
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show diagnostic logs on failure
        if: failure()
        run: docker logs dockge-check || true
