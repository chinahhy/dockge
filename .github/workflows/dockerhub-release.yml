name: Publish Hoya Docker Hub image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.repository == 'chinahhy/dockge' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run build:frontend
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Check publishing credential
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: test -n "$DOCKERHUB_TOKEN" || { echo 'Add DOCKERHUB_TOKEN to this repository Actions secrets.'; exit 1; }
      - uses: docker/login-action@v3
        with:
          username: hoya0803
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish amd64 and arm64
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: hoya0803/dockge:latest
          labels: |
            org.opencontainers.image.source=https://github.com/chinahhy/dockge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.5.0-hoya.ws1
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Dockge with WebSocket-first connections and polling fallback
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "hoya0803/dockge@$IMAGE_DIGEST"
          printf 'Published `hoya0803/dockge:latest`\n\nDigest: `%s`\n\nRevision: `%s`\n' "$IMAGE_DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
